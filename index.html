<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1326" />
  <!-- Text and addresses below are filled at build time from src/locales/en/common.json
       and src/constants/site.js (vite.config.js), then switched to the visitor's
       language at runtime (src/i18n). -->
  <meta name="description" content="%META_DESCRIPTION%" />
  <link rel="canonical" href="%CANONICAL_URL%" />
  <!-- %HREFLANG% -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%CANONICAL_URL%" />
  <meta property="og:title" content="%META_TITLE%" />
  <meta property="og:description" content="%META_OG_DESCRIPTION%" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="ar_SA" />
  <meta property="og:locale:alternate" content="tr_TR" />
  <meta property="og:image" content="%SITE_URL%/me.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    rel="stylesheet" />
  <title>%META_TITLE%</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
